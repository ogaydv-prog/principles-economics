<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 9 | Principles of Economics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 30px;
        }

        /* Верхняя панель */
        .top-bar {
            width: 100%;
            max-width: 1450px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            padding-top: 10px;
        }

        .top-left-logo {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .header-titles {
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #001e50;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #555555;
            line-height: 1.4;
        }

        .back-button {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
            background-color: #001e50;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.3s ease;
            white-space: nowrap;
        }

        .back-button:hover {
            background-color: #003380;
        }

        /* Контейнер карточек — ровно по центру высоты страницы */
        .grid-container {
            display: flex;
            flex-wrap: nowrap;
            gap: 18px;
            max-width: 1450px;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            padding: 20px 0;
        }

        /* Рамка под картинки 185x300px */
        .card {
            display: block;
            text-decoration: none;
            background: #ffffff;
            border: 2px solid #001e50;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 30, 80, 0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 185px; 
            height: 300px; 
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .card img {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
            object-fit: fill !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Подсветка карточек при наведении */
        .card:hover {
            transform: translateY(-10px) scale(1.04);
            border: 3px solid #0284c7;
            box-shadow: 0 12px 28px rgba(2, 132, 199, 0.35), inset 0 0 10px rgba(2, 132, 199, 0.15);
        }

        footer {
            margin-top: auto;
            font-size: 14px;
            color: #718096;
            padding-top: 30px;
            padding-bottom: 20px;
            text-align: center;
            line-height: 1.6;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 1250px) {
            .grid-container {
                flex-wrap: wrap;
                gap: 16px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .top-bar {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
                margin-bottom: 20px;
            }

            .top-left-logo, .back-button {
                position: static;
                transform: none;
            }

            .top-left-logo {
                width: 52px;
                height: 52px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }

            .back-button {
                padding: 8px 14px;
                font-size: 13px;
            }

            .grid-container {
                margin: 10px 0;
            }

            .card {
                width: 155px;
                height: 250px;
            }
        }
    </style>
</head>

    <!-- Верхняя панель -->
    <div class="top-bar">

        <div class="header-titles">

    </div>

            <img src="pic-cpi-task-pe.png" alt="CPI Lab Task">

        <!-- 6. Видеолекция -->

            <img src="pic-video9-pe.png" alt="Video Lecture">
        </a>
    </main>

    <footer>
        <p>Developed for Principles of Economics Course AlmaU 2026</p>
        <p>© Almaty Management University | School of Digital Technologies & Economics</p>
    </footer>

</body>
</html>
