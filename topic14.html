<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 14 | Principles of Economics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 30px;
            position: relative;
        }

        /* Логотип AlmaU в крайнем левом верхнем углу на десктопе */
        .top-left-logo {
            position: absolute;
            top: 25px;
            left: 30px;
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        /* Верхняя панель: заголовок по центру, кнопка справа на уровне названия */
        .top-bar {
            width: 100%;
            max-width: 1450px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            position: relative;
            padding-top: 10px;
        }

        .header-titles {
            text-align: center;
            padding: 0 180px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #001e50;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #555555;
            line-height: 1.4;
        }

        .back-button {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
            background-color: #001e50;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.3s ease;
            white-space: nowrap;
        }

        .back-button:hover {
            background-color: #003380;
        }

        /* Контейнер карточек */
        .grid-container {
            display: flex;
            flex-wrap: nowrap;
            gap: 18px;
            max-width: 1450px;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            padding: 20px 0;
        }

        /* Тонкая тёмно-серая рамка по умолчанию */
        .card {
            display: block;
            text-decoration: none;
            background-color: #3b4252;
            border: 2px solid #3b4252;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(59, 66, 82, 0.22);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        border-color 0.3s ease,
                        border-width 0.25s ease,
                        background-color 0.3s ease,
                        box-shadow 0.3s ease;
            width: 185px;
            height: 304px;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            padding: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            border: none;
            margin: 0;
            padding: 0;
            border-radius: 5px;
        }

        /* Увеличение, утолщение рамки и светло-песочная подсветка при наведении */
        .card:hover {
            transform: translateY(-10px) scale(1.05);
            background-color: #e6d5b8;
            border-width: 4px;
            border-color: #e6d5b8;
            box-shadow: 0 12px 28px rgba(214, 192, 156, 0.7), 0 0 22px rgba(243, 232, 210, 0.95);
        }

        footer {
            margin-top: auto;
            font-size: 14px;
            color: #718096;
            padding-top: 25px;
            padding-bottom: 10px;
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 1250px) {
            .grid-container {
                flex-wrap: wrap;
                gap: 16px;
            }
        }

        /* Адаптация под смартфон */
        @media (max-width: 768px) {
            body {
                padding: 14px 12px;
            }

            .top-left-logo {
                position: static;
                margin: 0 auto 10px auto;
                display: block;
                width: 48px;
                height: 48px;
            }

            .top-bar {
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-bottom: 16px;
                padding-top: 0;
            }

            .header-titles {
                padding: 0 6px;
                text-align: center;
            }

            h1 {
                font-size: 20px;
            }

            .subtitle {
                font-size: 12.5px;
            }

            .back-button {
                position: static;
                transform: none;
                margin: 0 auto;
                padding: 8px 16px;
                font-size: 13px;
            }

            .grid-container {
                display: grid;
                grid-template-columns: repeat(2, minmax(140px, 165px));
                justify-content: center;
                gap: 14px;
                margin: 8px 0;
                padding: 10px 0;
            }

            .card {
                width: 100%;
                height: auto;
                aspect-ratio: 185 / 304;
            }

            footer {
                font-size: 12px;
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Логотип AlmaU в левом верхнем углу экрана -->
    <img src="https://ogaydv-prog.github.io/principles-of-economics/almau.jpg"
         alt="AlmaU Logo"
         class="top-left-logo"
         onerror="this.onerror=null; this.src='./almau.jpg';">

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="header-titles">
            <h1>Topic 14: International Trade</h1>
            <p class="subtitle">
                Select a learning resource below: lecture notes, presentation, trade simulators, reading materials, or video lecture.
            </p>
        </div>
        <a href="topics.html" class="back-button">← Back to Topics</a>
    </div>

    <!-- Основная сетка ресурсов (6 карточек) -->
    <main class="grid-container">
        <!-- 1. Лекция -->
        <a href="lecture14-pro.html" class="card" title="Lecture Notes — Topic 14">
            <img src="https://ogaydv-prog.github.io/principles-of-economics/pic-lecture14.png"
                 alt="Lecture Notes"
                 onerror="this.onerror=null; this.src='./pic-lecture14.png';">
        </a>

        <!-- 2. Презентация Canva -->
        <a href="https://canva.link/7q9woxmvq4xhe7p" target="_blank" rel="noopener noreferrer" class="card" title="Presentation — Topic 14">
            <img src="https://ogaydv-prog.github.io/principles-of-economics/pic-preza14.png"
                 alt="Presentation"
                 onerror="this.onerror=null; this.src='./pic-preza14.png';">
        </a>

        <!-- 3. Симулятор Международной торговли -->
        <a href="sim-trade.html" class="card" title="International Trade Simulator">
            <img src="https://ogaydv-prog.github.io/principles-of-economics/pic-sim-trade.png"
                 alt="International Trade Simulator"
                 onerror="this.onerror=null; this.src='./pic-sim-trade.png';">
        </a>

        <!-- 4. Симулятор Стандартной модели торговли -->
        <a href="sim-standart-model.html" class="card" title="Standard Trade Model Simulator">
            <img src="https://ogaydv-prog.github.io/principles-of-economics/pic-sim-standart-trade.png"
                 alt="Standard Trade Model Simulator"
                 onerror="this.onerror=null; this.src='./pic-sim-standart-trade.png';">
        </a>

        <!-- 5. Обязательное чтение (Google Docs) -->
        <a href="https://docs.google.com/document/d/1NMJSbimYHS33THK_DS2U5aEqcGYg-1VB/edit?usp=sharing&ouid=109725301150629205728&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer" class="card" title="Required Reading — Topic 14">
            <img src="https://ogaydv-prog.github.io/principles-of-economics/pic-reading14.png"
                 alt="Required Reading"
                 onerror="this.onerror=null; this.src='./pic-reading14.png';">
        </a>

        <!-- 6. Видеолекция (YouTube — прямой переход без переворота) -->
        <a href="https://www.youtube.com/watch?v=XGrKx2chuI4" target="_blank" rel="noopener noreferrer" class="card" title="Video Lecture — Topic 14">
            <img src="https://ogaydv-prog.github.io/principles-of-economics/pic-video14.png"
                 alt="Video Lecture"
                 onerror="this.onerror=null; this.src='./pic-video14.png';">
        </a>
    </main>

    <footer>
        <p>Developed for International Business Team | Principles of Economics</p>
        <p>© AlmaU | School of Digital Technologies & Economics</p>
    </footer>

</body>
</html>
