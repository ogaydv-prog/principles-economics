name: Weekly News Updater

on:
  schedule:
    # Запуск каждый понедельник в 05:00 UTC (10:00 утра по времени Алматы)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Позволяет при желании запустить обновление вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.x'

      - name: Fetch news and update ibn.html
        run: python update_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ibn.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly economics news [skip ci]" && git push)
